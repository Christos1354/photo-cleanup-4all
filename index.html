<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Τα Προγράμματά μου</title>
<link rel="icon" type="image/png" href="launcher-icon.png">
<style>
  :root{
    --bg:#2B1B40;
    --panel:#3A2856;
    --panel-2:#453266;
    --text:#F2ECE1;
    --text-dim:#B9C2CE;
    --gold:#E8A33D;
  }
  *{box-sizing:border-box;}
  html,body{ height:100%; margin:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px 20px; gap:34px;
  }
  h1{
    font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif;
    font-size:42px; color:var(--gold); margin:0;
  }
  p{ color:var(--text-dim); font-size:19px; max-width:520px; margin:0; }
  .cards{ display:flex; gap:28px; flex-wrap:wrap; justify-content:center; }
  .card{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    background:var(--panel); border-radius:20px; padding:36px 30px;
    width:230px; text-decoration:none; color:var(--text);
    border:2px solid transparent;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }
  .card:hover{ border-color:var(--gold); background:var(--panel-2); }
  .card .icon{ font-size:64px; }
  .card .name{ font-size:20px; font-weight:700; }
  .card .desc{ font-size:14px; color:var(--text-dim); }
</style>
</head>
<body>
  <h1>👋 Τα Προγράμματά μου</h1>
  <p>Διάλεξε τι θέλεις να ανοίξεις σήμερα.</p>
  <div class="cards">
    <a class="card" href="%CE%9A%CE%B1%CE%B8%CE%B1%CF%81%CE%B9%CF%83%CE%BC%CF%8C%CF%82%20%CE%A6%CF%89%CF%84%CE%BF%CE%B3%CF%81%CE%B1%CF%86%CE%B9%CF%8E%CE%BD.html">
      <div class="icon">🧹</div>
      <div class="name">Καθαρισμός</div>
      <div class="desc">Βρες διπλές, θολές, και διπλά έγγραφα</div>
    </a>
    <a class="card" href="Flip%20Album.html">
      <div class="icon">📖</div>
      <div class="name">Flip Album</div>
      <div class="desc">Απόλαυσε τις φωτογραφίες σου σαν άλμπουμ</div>
    </a>
  </div>
</body>
</html>
